[workspace]
resolver = "2"
members = ["crates/tantivy-worker", "crates/tantivy-wasm"]
# tantivy-wasm only makes sense for wasm32-unknown-emscripten (it is a staticlib
# whose ring ops are supplied by emcc's --js-library), so keep it out of the
# default set: bare `cargo build` / `test` / `clippy` stay native-only and
# unchanged. Build it explicitly with `wasm/build.sh` or `-p tantivy-wasm`.
default-members = ["crates/tantivy-worker"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
authors = ["Query Farm LLC <hello@query.farm>"]
repository = "https://github.com/Query-farm/vgi-tantivy"

[workspace.dependencies]
# VGI Rust SDK (worker side), published on crates.io. Provides the wasm
# `vgi::wasm_worker!` macro used by tantivy-wasm (since 0.24); 0.50.0 requires rustc 1.97 (see
# rust-version above). Base (feature-less) so each target can opt in: the native
# build takes the SDK's real defaults (`sqlite` + `transport-http`), while the
# wasm build must NOT — tokio/mio/axum and bundled SQLite do not compile for
# wasm32, and the browser transport serves over a byte channel rather than HTTP.
# Features are additive, and the two are behind mutually-exclusive target cfgs.
# Keep the arrow entries below in lockstep with what `vgi` requires so a single
# arrow resolves.
vgi = { version = "0.50.0", default-features = false }
vgi-rpc = { version = "0.32.3", default-features = false, features = ["macros"] }
arrow-array = "59.2"
arrow-buffer = "59.2"
arrow-schema = "59.2"

# tantivy — the Rust full-text search engine (MIT). 0.27 declares rust-version
# 1.88, under the workspace rust-version (1.97). We use only the in-process
# RAM-directory index, its BM25 scoring, and its tokenizer/Snowball-stemmer
# stack — no on-disk index, no mmap persistence. Since 0.26 `TopDocs` must be
# finished with `.order_by_score()` before it is a `Collector`.
# Default features minus `columnar-zstd-compression` (new default in 0.27): it
# pulls zstd-sys (C), which needs emcc to cross-build tantivy-wasm and is unused
# by an in-RAM index. `stemmer` became a feature (on by default) in 0.27.
tantivy = { version = "0.27", default-features = false, features = [
    "mmap",
    "stopwords",
    "lz4-compression",
    "stemmer",
] }

# JSON parsing for the `bm25_search` docs payload (a JSON array of strings or
# {"id","text"} objects).
serde_json = "1"
